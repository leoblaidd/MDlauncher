name: Build & Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar release (cria a tag v<versão> se não existir)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Versão
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Dependências
        run: npm ci

      - name: Build (Tauri + instalador NSIS)
        run: npx tauri build

      - name: Teste do executável
        shell: pwsh
        run: |
          $env:MDLAUNCHER_HOME = "$env:RUNNER_TEMP\mdl-selftest"
          $p = Start-Process -FilePath "src-tauri\target\release\MDLauncher.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "Saída: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Organizar arquivos
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "out\MDLauncher-$v-Setup.exe"
          Copy-Item "src-tauri\target\release\MDLauncher.exe" "out\MDLauncher-$v-Portable.exe"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: MDLauncher-${{ steps.ver.outputs.version }}
          path: out/*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MD Launcher ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: out/*
